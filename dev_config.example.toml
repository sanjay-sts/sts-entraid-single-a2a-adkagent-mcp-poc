# =============================================================
# Development Auth Bypass Configuration
# =============================================================
# WARNING: This file disables authentication for local testing.
# NEVER deploy with these settings enabled.
#
# Usage:
#   1. Copy this file to dev_config.toml
#   2. Set disable_auth = true for servers you want to bypass
#   3. Restart the affected servers
#
# The actual dev_config.toml is gitignored.
# =============================================================

[a2a]
disable_auth = false

[adk]
disable_auth = false

[mcp]
disable_auth = false
# Mock identity when auth is disabled (controls which tools are accessible)
default_role = "admin"                  # admin | developer | viewer
default_email = "dev@localhost"
default_provider = "entra"              # entra | cognito | auth0
default_scopes = ["User.Read", "Files.Read", "Mail.Send", "Files.ReadWrite.All"]
# ABAC attributes for Cedar policy testing
# - archiver is header-overridable via X-Abac-Attrs JSON (controls delete_s3_object)
# - department is claim-only — X-Abac-Attrs CANNOT override it (security)
# default_archiver = true       # Set true to enable delete_s3_object for developer role
# default_department = "IT"     # Mocked dept claim when auth is disabled

[servicenow]
# Empty instance_url → tool calls are routed through the in-memory mock
# (mcp_server/servicenow_mock.py). Useful for local dev without a real
# ServiceNow instance.
instance_url = ""
# Set both to use a real instance via HTTP Basic auth:
#   instance_url = "https://devXXXXX.service-now.com"
#   api_user     = "admin"
#   api_password = "<your-password>"
api_user     = ""
api_password = ""
# OBO (hybrid model): when set, the MCP server exchanges the end user's Entra
# token for a ServiceNow-scoped token so SN applies that user's own ACLs.
# Empty → OBO off; every call uses the service account above. Entra-only;
# requires ENTRA_CLIENT_SECRET. See docs/servicenow-obo-setup.md.
#   obo_scope = "api://<servicenow-app-id>/.default"
obo_scope    = ""
