[project]
name = "identity-aware-agent"
version = "1.0.0"
description = "Identity-Aware AI Agent System with three-tier access control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0.0",
    "google-adk>=1.25.0",
    "google-genai>=1.0.0",
    "litellm>=1.30.0",
    "a2a-sdk[http-server]>=0.3.20",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "httpx>=0.26.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-html>=4.0.0",
    "pytest-timeout>=2.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests that go through the LLM pipeline (10-30s each)",
]
addopts = "--html=reports/test_report.html --self-contained-html -v"
timeout = 120
